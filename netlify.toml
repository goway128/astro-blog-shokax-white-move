[build]
framework = "astro"
command = "bun install --frozen-lockfile && bun run build"
publish = "dist"

[build.environment]
BUN_VERSION = "1.3.14"

[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"
[headers.values]
Content-Security-Policy = "frame-ancestors 'none';"
X-Frame-Options = "DENY"
